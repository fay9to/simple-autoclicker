[package]
name = "simple-autoclicker"
version = "3.1.1"
edition = "2021"
description = "Simple Auto Clicker - Windows auto clicker with record & playback"
license = "MIT"
build = "build.rs"

[[bin]]
name = "SimpleAutoClicker"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
